[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice Agent Engineering Workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.2",
    "websockets>=17.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
wbench = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
